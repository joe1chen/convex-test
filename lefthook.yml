pre-commit:
  piped: true
  skip:
    - rebase
    - merge
    - ref: mirror
    - ref: tooling
    - ref: format
  commands:
    1_check:
      glob: "*.{js,mjs,cjs,ts,json,jsonc}"
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    2_no-comments:
      glob: "*.ts"
      exclude:
        - "**/_generated/**"
      run: cargo run --quiet --release --manifest-path /Users/josephchen/Dev/gongboo-ban/tools/check-banned-patterns/Cargo.toml -- --strip-comments {staged_files} && git diff --exit-code -- {staged_files}
